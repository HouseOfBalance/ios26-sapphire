name: Build iOS RootFS (Userdata Sparse Image)

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct Apple IPSW URL (Leave empty to use default iPhone11,8 iOS 18.7.8)'
        required: false
        default: ''
      device:
        description: 'Apple Device Identifier'
        required: false
        default: 'iPhone11,8'
      build_version:
        description: 'iOS Version'
        required: false
        default: '18.7.8'

jobs:
  build-rootfs:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          brew install blacktop/tap/ipsw zstd

      - name: Verify Dyld Shared Cache Flattener
        run: |
          python3 tools/dsc_flatten_v2.py --test

      - name: Fetch Root DMGs
        run: |
          mkdir -p research/ios18/ipsw
          if [ -n "${{ github.event.inputs.ipsw_url }}" ]; then
            URL="${{ github.event.inputs.ipsw_url }}"
            python3 tools/renegade/fetch_root.py --url "$URL" --out-dir research/ios18/ipsw
          else
            python3 tools/renegade/fetch_root.py --device "${{ github.event.inputs.device }}" --version "${{ github.event.inputs.build_version }}" --out-dir research/ios18/ipsw
          fi

      - name: Build Root Image with Renegade & DSC Flattener
        run: |
          mkdir -p out
          python3 tools/renegade/mkroot-full.py \
            --ipsw-dir research/ios18/ipsw \
            --out out/ios-root.img \
            --simg out/userdata.simg \
            --size 16g

      - name: Verify Generated Sparse Image
        run: |
          ls -lh out/ || true
          mkdir -p out/parts
          if [ -f out/userdata.simg ]; then
            echo "Successfully generated userdata.simg"
            # Split if larger than 2GB for GitHub artifact upload limits
            split -b 1900M out/userdata.simg out/parts/userdata.simg.part_
            echo "To join split parts on Windows: copy /b userdata.simg.part_* userdata.simg" > out/parts/HOW_TO_JOIN.txt
            echo "To join split parts on macOS/Linux: cat userdata.simg.part_* > userdata.simg" >> out/parts/HOW_TO_JOIN.txt
            echo "Then flash: fastboot -S 512M flash userdata userdata.simg" >> out/parts/HOW_TO_JOIN.txt
          fi

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakios-ios-rootfs
          path: out/parts/
          if-no-files-found: error
