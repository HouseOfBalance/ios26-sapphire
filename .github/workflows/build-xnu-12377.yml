name: Build HakiOS XNU 12377 (iOS 26) - Sapphire

on:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "base/**"
      - "enxerto/**"
      - "tools/**"
      - "sapphire.adt"
      - "dtb/sapphire/**"
      - ".github/workflows/build-xnu-12377.yml"
  workflow_dispatch:
    inputs:
      compress_payload:
        description: 'Compress payload segments >=1MiB with DEFLATE (payload v2)'
        required: false
        default: 'true'
        type: boolean
      bootlog:
        description: 'Enable boot UI log window (BOOTUI_LOG=1)'
        required: false
        default: 'false'
        type: boolean
      bergamota_fastboot:
        description: 'Force bergamota.fastboot=1 in kernel cmdline'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-kernel:
    name: Build XNU Kernel (Sapphire/SM6225)
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      kernel_path: ${{ steps.find_kernel.outputs.kernel_path }}
    env:
      XNU_ARCH: arm64e
      MACHINE_CONFIGS: sapphire
      RC_DARWIN_KERNEL_VERSION: 26.0.0
      RC_ProjectSourceVersion: 12377.121.6
      RC_ProjectName: xnu
      XNU_SDK_VERSION: 26.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies (Homebrew)
        run: |
          brew update
          brew install jq bash cmake ninja ccache aarch64-elf-gcc aarch64-elf-binutils python3 zstd

      - name: Install Arm GNU Toolchain (AArch64 bare-metal for enxerto)
        run: |
          TOOLCHAIN_DIR="$HOME/arm-gnu-toolchain"
          if [ ! -f "$TOOLCHAIN_DIR/bin/aarch64-none-elf-gcc" ]; then
            echo "Downloading Arm GNU Toolchain 13.3.Rel1 for darwin-arm64..."
            mkdir -p "$TOOLCHAIN_DIR"
            cd /tmp
            curl -L -o arm-toolchain.tar.xz \
              "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-darwin-arm64-aarch64-none-elf.tar.xz"
            tar -xf arm-toolchain.tar.xz -C "$TOOLCHAIN_DIR" --strip-components=1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH
          aarch64-none-elf-gcc --version

      - name: Ensure Executable Permissions
        run: |
          chmod -R +x base/xnu-deps/host/bin base/*.sh kernel/*.sh tools/*.py enxerto/*.py enxerto/*.sh

      - name: Prepare XNU 12377 Source Tree (Dada + Sapphire Patches)
        run: |
          echo "=== Cloning and applying patches to XNU 12377.121.6 ==="
          bash kernel/apply.sh xnu-src
          echo "XNU source tree prepared at xnu-src"

      - name: Setup XNU Build Environment
        run: |
          echo "=== Setting up XNU build environment ==="
          export XNU_SRC="$PWD/xnu-src"
          export XNUDEPS="$PWD/base/xnu-deps"
          export XNU_SDK_PATH="$XNUDEPS/sdk/iPhoneOS.xnu.sdk"
          export XNU_SDK_VERSION=26.0
          export XNU_PLATFORM_PATH="$XNUDEPS/sdk/Platforms/iPhoneOS.platform"
          export THEOS="${THEOS:-$HOME/theos}"
          export PATH="$XNUDEPS/host/bin:$PATH"

          cd base/xnu-deps
          bash setup.sh --stage1
          cd ../..

          chmod -R +x base/xnu-deps/host/bin base/xnu-deps/build/pthread/*.sh

          # Install availability.pl and internal headers into host Xcode iPhoneOS SDK
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Xcode iPhoneOS SDK path: $SDK_PATH"
          sudo mkdir -p "$SDK_PATH/usr/local/libexec" "$SDK_PATH/usr/local/include/kernel/os" "$SDK_PATH/usr/local/lib/kernel"

          if [ -f base/xnu-deps/AvailabilityVersions/availability.pl ]; then
            sudo cp base/xnu-deps/AvailabilityVersions/availability.pl "$SDK_PATH/usr/local/libexec/"
            sudo chmod +x "$SDK_PATH/usr/local/libexec/availability.pl"
            echo "Installed availability.pl"
          fi

          if [ -d base/xnu-deps/sdk/iPhoneOS.xnu.sdk/usr/local ]; then
            sudo cp -R base/xnu-deps/sdk/iPhoneOS.xnu.sdk/usr/local/. "$SDK_PATH/usr/local/" 2>/dev/null || true
            echo "Synced overlay usr/local headers"
          fi

          # Compile HakiOS Sapphire kernel stubs
          echo "Compiling HakiOS Sapphire kernel stubs..."
          xcrun -sdk iphoneos clang -arch arm64e -target arm64e-apple-ios26.0 -mkernel -c kernel/stubs.c -o kernel/stubs.o

          # Create static libraries for SDK
          sudo xcrun -sdk iphoneos libtool -static -o "$SDK_PATH/usr/local/lib/kernel/libfirehose_kernel.a" kernel/stubs.o
          sudo xcrun -sdk iphoneos libtool -static -o "$SDK_PATH/usr/local/lib/kernel/libpthread_kext.a" kernel/stubs.o

          # Install into overlay SDK and target build obj dir (Sapphire, not BCM2837)
          mkdir -p base/xnu-deps/sdk/iPhoneOS.xnu.sdk/usr/local/lib/kernel xnu-src/BUILD/obj/DEVELOPMENT_ARM64_SAPPHIRE
          sudo cp -v "$SDK_PATH/usr/local/lib/kernel/"*.a base/xnu-deps/sdk/iPhoneOS.xnu.sdk/usr/local/lib/kernel/
          cp -v "$SDK_PATH/usr/local/lib/kernel/"*.a xnu-src/BUILD/obj/DEVELOPMENT_ARM64_SAPPHIRE/

      - name: Compile XNU Kernel (Sapphire/SM6225)
        run: |
          echo "=== Compiling XNU Kernel for Sapphire ==="
          export XNU_SRC="$PWD/xnu-src"
          export XNUDEPS="$PWD/base/xnu-deps"
          export XNU_SDK_PATH="$XNUDEPS/sdk/iPhoneOS.xnu.sdk"
          export XNU_SDK_VERSION=26.0
          export XNU_PLATFORM_PATH="$XNUDEPS/sdk/Platforms/iPhoneOS.platform"
          export THEOS="${THEOS:-$HOME/theos}"
          export PATH="$XNUDEPS/host/bin:$PATH"

          export XNU_ARCH=arm64e
          export MACHINE_CONFIGS=sapphire
          export RC_DARWIN_KERNEL_VERSION=26.0.0
          export RC_ProjectSourceVersion=12377.121.6
          export RC_ProjectName=xnu
          export XNU_SDK_VERSION=26.0
          export LIBRARY_PATH="$(xcrun --sdk iphoneos --show-sdk-path)/usr/local/lib/kernel:$PWD/base/xnu-deps/sdk/iPhoneOS.xnu.sdk/usr/local/lib/kernel:$LIBRARY_PATH"

          # Build with MACHINE_CONFIGS=sapphire (selects sapphire platform from base/common/devices/sapphire.platform.c)
          bash base/xnu-build.sh -j$(sysctl -n hw.ncpu) -k

          ls -la xnu-src/BUILD/obj/*/mach.* 2>/dev/null || true

      - name: Find Kernel Binary
        id: find_kernel
        run: |
          KERNEL=""
          for k in $(find xnu-src/BUILD/obj -name 'mach.*' -type f 2>/dev/null); do
            if file "$k" | grep -q 'Mach-O'; then
              KERNEL="$k"
              break
            fi
          done
          if [ -z "$KERNEL" ]; then
            echo "ERROR: Compiled kernel binary not found!"
            exit 1
          fi
          echo "Found kernel: $KERNEL"
          echo "kernel_path=$KERNEL" >> $GITHUB_OUTPUT

      - name: Verify & Patch Kernel
        run: |
          echo "=== Verifying and patching kernel ==="
          mkdir -p out

          python3 tools/verify_kernel_markers.py "${{ steps.find_kernel.outputs.kernel_path }}"
          python3 kernel/patch_kernel_pac.py "${{ steps.find_kernel.outputs.kernel_path }}"

          cp "${{ steps.find_kernel.outputs.kernel_path }}" out/mach.development.sapphire
          echo "Kernel copied to out/mach.development.sapphire"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakios-ios26-sapphire-kernel
          path: |
            out/mach.development.sapphire
            xnu-src/BUILD/obj/DEVELOPMENT_ARM64_SAPPHIRE/
          if-no-files-found: error
          retention-days: 14

  build-boot:
    name: Build Boot Image (Sapphire)
    needs: build-kernel
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BOARD: sapphire
      CMDLINE_BASE: "-v debug=0xc serial=0 cpus=1 keepsyms=1 -enable_kprintf_spam sweetearlyfb=1 sweethidtest=3 ipc_legacy=1 cs_enforcement_disable=1 amfi_get_out_of_my_way=1 rootless=0 rd=md0 rpm=1 hv_wdt_pet=1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Kernel Artifact
        uses: actions/download-artifact@v4
        with:
          name: hakios-ios26-sapphire-kernel
          path: kernel-artifacts

      - name: Install Dependencies
        run: |
          brew update
          brew install python3 zstd
          TOOLCHAIN_DIR="$HOME/arm-gnu-toolchain"
          if [ ! -f "$TOOLCHAIN_DIR/bin/aarch64-none-elf-gcc" ]; then
            mkdir -p "$TOOLCHAIN_DIR"
            cd /tmp
            curl -L -o arm-toolchain.tar.xz \
              "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-darwin-x86_64-aarch64-none-elf.tar.xz"
            tar -xf arm-toolchain.tar.xz -C "$TOOLCHAIN_DIR" --strip-components=1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH
          aarch64-none-elf-gcc --version

      - name: Build Mockfs RAMDisk
        run: |
          echo "=== Building Mockfs RAMDisk for md0 ==="
          python3 tools/mkramdisk.py --format mockfs --arch arm64e out/ramdisk.img
          python3 tools/patch_userland_pac.py out/ramdisk.img
          ls -lh out/ramdisk.img

      - name: Build Payload with mkpayload.py
        run: |
          echo "=== Building payload.bin ==="
          mkdir -p out

          CMDLINE="${CMDLINE_BASE} modempool= gpupool="
          if [ "${{ github.event.inputs.bergamota_fastboot }}" = "true" ]; then
            CMDLINE="${CMDLINE} bergamota.fastboot=1"
          fi
          echo "Kernel cmdline: $CMDLINE"

          python3 tools/mkpayload.py \
            --compress="${{ github.event.inputs.compress_payload }}" \
            --cmdline "$CMDLINE" \
            --ramdisk out/ramdisk.img \
            kernel-artifacts/mach.development.sapphire \
            sapphire.adt \
            out/payload.bin

          ls -lh out/payload.bin

      - name: Build Enxerto Bootloader & Package Boot Images
        env:
          BOOTLOG: "${{ github.event.inputs.bootlog }}"
          BERGAMOTA: "${{ github.event.inputs.bergamota_fastboot }}"
          CHARGER: "0"
        run: |
          echo "=== Building Enxerto bootloader for Sapphire ==="

          python3 enxerto/build.py \
            --board sapphire \
            --payload out/payload.bin \
            --bootlog "${BOOTLOG}" \
            --bergamota "${BERGAMOTA}" \
            --charger "${CHARGER}" \
            --skip-host-tests

          # Copy artifacts to out/ for upload
          if [ -f enxerto/out/enxerto-boot.img ]; then
            cp enxerto/out/enxerto-boot.img out/
          fi
          if [ -f enxerto/out/charge-test.img ]; then
            cp enxerto/out/charge-test.img out/
          fi
          if [ -f enxerto/out/bergamota-fastboot.img ]; then
            cp enxerto/out/bergamota-fastboot.img out/
          fi
          if [ -f enxerto/out/bergamota-fastboot-flash.img ]; then
            cp enxerto/out/bergamota-fastboot-flash.img out/
          fi

          ls -la out/*.img 2>/dev/null || true

      - name: Verify Boot Images
        run: |
          echo "=== Verifying generated boot images ==="
          for img in out/*.img; do
            if [ -f "$img" ]; then
              echo "--- $img ---"
              xxd -l 64 "$img"
              echo ""
              MAGIC=$(xxd -l 8 -p "$img")
              if [ "$MAGIC" = "414e44524f494421" ]; then
                echo "  ✓ Valid ANDROID! magic"
              else
                echo "  ✗ Invalid magic: $MAGIC"
              fi
              SIZE=$(stat -c%s "$img")
              SHA=$(sha256sum "$img" | cut -d' ' -f1)
              echo "  Size: $SIZE bytes ($((SIZE/1024/1024)) MiB)"
              echo "  SHA256: $SHA"
            fi
          done

      - name: Upload Boot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-ios26-sapphire-boot
          path: |
            out/enxerto-boot.img
            out/charge-test.img
            out/bergamota-fastboot.img
            out/bergamota-fastboot-flash.img
            out/payload.bin
            out/mach.development.sapphire
            out/ramdisk.img
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "=== BUILD SUMMARY ==="
          echo "Platform: Sapphire (SM6225 / Snapdragon 685)"
          echo "Architecture: ARM64E (Cortex-A73/A53, ARMv8.0-A baseline)"
          echo "XNU Version: 12377.121.6 (iOS 26)"
          echo "Bootloader: Enxerto (boot.img v4 / GKI layout)"
          echo ""
          echo "Applied Patches:"
          echo "  - Dada base patch (xnu-12377.121.6-dada.patch)"
          echo "  - PAC Trap-and-Self-Patch (0001-pac-trap-and-self-patch.patch)"
          echo "  - LSE Branch Islands (0002-lse-branch-islands.patch)"
          echo "  - SLEH Trap Hooks (0003-sleh-hook.patch)"
          echo "  - 4KB Quad-PTE Pmap (0004-pmap-4kb-quad-pte.patch)"
          echo "  - Cortex-A73 sysreg stub + VM fixes"
          echo ""
          echo "Boot Arguments:"
          echo "  - modempool= (16MB below 0xF0000000 for TrustZone/modem)"
          echo "  - gpupool= (GPU pool allocation)"
          echo "  - rpm=1 (RPMh power management)"
          echo "  - hv_wdt_pet=1 (Hypervisor watchdog)"
          echo "  - rd=md0 (Mockfs ramdisk as root)"
          echo ""
          ls -lh out/ 2>/dev/null || true